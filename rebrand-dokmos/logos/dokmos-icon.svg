<!-- DOKMOS Logo SVG - Símbolo Isolado (Ícone) -->
<!-- Design: 4 barras verticais arredondadas interleaved -->
<!-- Uso: Favicon, avatar, marca d'água -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" aria-labelledby="dokmosIconTitle">
  <title id="dokmosIconTitle">DOKMOS Icon</title>
  <defs>
    <linearGradient id="dokmosIconGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#286875;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3d8a99;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 4 barras verticais arredondadas -->
  <rect x="10" y="20" width="16" height="60" rx="8" ry="8" fill="url(#dokmosIconGradient)"/>
  <rect x="32" y="10" width="16" height="80" rx="8" ry="8" fill="url(#dokmosIconGradient)"/>
  <rect x="54" y="10" width="16" height="80" rx="8" ry="8" fill="url(#dokmosIconGradient)"/>
  <rect x="76" y="20" width="16" height="60" rx="8" ry="8" fill="url(#dokmosIconGradient)"/>
</svg>
